<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RevSound</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#0f141c; --panel:#141a24; --panel2:#1b2230;
    --fg:#eef2f8; --muted:#8b96a8; --line:#28303d;
    --accent:#ff3b24; --accent2:#ff7a2f; --good:#2fd27a; --warn:#f2b32e;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;color:var(--fg);font-family:var(--font);
    background:radial-gradient(1200px 600px at 50% -10%,#18202c 0%,var(--bg) 60%);
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
            max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  .wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:800;letter-spacing:.12em;font-size:1rem}
  .brand b{color:var(--accent)}
  .status{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 transparent}
  .dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
  .dot.sim{background:var(--warn)} .dot.err{background:var(--accent)}

  /* ---- прибор оборотов ---- */
  .gauge{position:relative;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
  .gauge svg{display:block;width:100%;height:auto}
  .gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none}
  .rpm{font-family:var(--mono);font-weight:800;font-size:3.4rem;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .rpm.run{color:var(--good)} .rpm.red{color:var(--accent)}
  .rpmU{font-size:.72rem;letter-spacing:.22em;color:var(--muted);margin-top:4px}
  .chips{display:flex;gap:8px;margin-top:12px;justify-content:center}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:.78rem;color:var(--muted);display:flex;gap:7px;align-items:center}
  .chip b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
  .chip.gear b{color:var(--accent2)}

  /* ---- режимы ---- */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:6px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
    padding:13px 8px;border-radius:11px;cursor:pointer;transition:.18s;font-size:.92rem}
  .seg button.on{background:linear-gradient(180deg,var(--accent),#d42a16);color:#fff;
    box-shadow:0 6px 16px rgba(255,59,36,.35)}

  /* ---- зажигание ---- */
  .ign{border:1px solid var(--line);border-radius:18px;padding:17px;font:inherit;font-weight:800;
    font-size:1.05rem;letter-spacing:.04em;cursor:pointer;color:var(--fg);
    background:linear-gradient(180deg,var(--panel2),var(--panel));transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .ign.on{background:linear-gradient(180deg,var(--good),#1ea85e);color:#04110a;
    box-shadow:0 8px 22px rgba(47,210,122,.3)}
  .ign .ic{width:20px;height:20px;display:inline-block}

  /* ---- громкость ---- */
  .vol{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
    display:flex;align-items:center;gap:14px}
  .vol .ic{width:22px;height:22px;color:var(--muted);flex:none}
  .vol input{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
    background:var(--panel2);outline:none}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--fg);border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .vol input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);
    border:3px solid var(--accent);cursor:pointer}
  .vol .val{font-family:var(--mono);font-weight:700;width:38px;text-align:right;color:var(--fg)}

  /* ---- педаль газа ---- */
  .pedal{position:relative;height:190px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
    background:repeating-linear-gradient(180deg,var(--panel) 0 22px,var(--bg2) 22px 44px);
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:var(--shadow) inset}
  .pedal .fill{position:absolute;left:0;right:0;bottom:0;height:0;
    background:linear-gradient(0deg,var(--accent) 0%,var(--accent2) 100%);transition:height .05s linear}
  .pedal .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4px;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .pedal .lbl .big{font-family:var(--mono);font-weight:800;font-size:2.1rem;font-variant-numeric:tabular-nums}
  .pedal .lbl .sm{font-size:.74rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .pedal.held{border-color:var(--accent)}
  .pedal.held .lbl .sm{color:#fff}

  .hint{text-align:center;font-size:.72rem;color:var(--muted);margin-top:-6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">REV<b>SOUND</b></div>
    <div class="status"><span class="dot" id="dot"></span><span id="st">подключение…</span></div>
  </header>

  <div class="gauge">
    <svg viewBox="0 0 220 180" aria-hidden="true">
      <path id="track" fill="none" stroke="#222b38" stroke-width="16" stroke-linecap="round"/>
      <path id="zone"  fill="none" stroke="#3a1510" stroke-width="16" stroke-linecap="round"/>
      <path id="valArc" fill="none" stroke="var(--good)" stroke-width="16" stroke-linecap="round"/>
      <line id="needle" stroke="var(--fg)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="110" cy="120" r="8" fill="var(--fg)"/>
    </svg>
    <div class="gc">
      <div class="rpm" id="rpm">0</div>
      <div class="rpmU">ОБ/МИН</div>
    </div>
    <div class="chips">
      <div class="chip gear">передача <b id="gear">N</b></div>
      <div class="chip">газ <b id="thr">0</b>%</div>
    </div>
  </div>

  <div class="seg" id="modeSeg">
    <button data-m="1" class="on">Газовка на месте</button>
    <button data-m="0">Езда (АКПП)</button>
  </div>

  <button class="ign" id="ign">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
    <span id="ignTxt">Запустить двигатель</span>
  </button>

  <div class="vol">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
    <input type="range" id="vol" min="0" max="100" value="80">
    <span class="val" id="volVal">80</span>
  </div>

  <div class="pedal" id="pedal">
    <div class="fill" id="pfill"></div>
    <div class="lbl"><span class="big" id="plbl">0%</span><span class="sm">газ — держи</span></div>
  </div>
  <div class="hint">держи и веди вверх — сильнее газ · отпустил — сброс</div>
</div>

<script>
const MAXRPM=7000, REDRPM=6000;
let ws=null, ign=false, mode=1, thr=0, lastThr=-1, vol=80;

// ---- геометрия прибора (270° дуга, центр 110,120, r=86) ----
const CX=110, CY=120, R=86, A0=135, SWEEP=270;
const d2r=d=>d*Math.PI/180;
function pt(a){ return [CX+R*Math.cos(d2r(a)), CY+R*Math.sin(d2r(a))]; }
function arc(aStart,aEnd){
  const [x0,y0]=pt(aStart), [x1,y1]=pt(aEnd);
  const large=(aEnd-aStart)>180?1:0;
  return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
const ARCLEN=2*Math.PI*R*(SWEEP/360);
document.getElementById("track").setAttribute("d",arc(A0,A0+SWEEP));
document.getElementById("zone").setAttribute("d",arc(A0+SWEEP*(REDRPM/MAXRPM),A0+SWEEP));
const valArc=document.getElementById("valArc"), needle=document.getElementById("needle");
valArc.setAttribute("d",arc(A0,A0+SWEEP));
valArc.style.strokeDasharray=ARCLEN;

function setRpm(r){
  r=Math.max(0,Math.min(MAXRPM,r));
  const f=r/MAXRPM;
  valArc.style.strokeDashoffset=ARCLEN*(1-f);
  valArc.style.stroke = r>=REDRPM?"var(--accent)" : r>=REDRPM*0.75?"var(--warn)":"var(--good)";
  const a=A0+SWEEP*f, [nx,ny]=pt(a);
  needle.setAttribute("x1",CX); needle.setAttribute("y1",CY);
  needle.setAttribute("x2",nx.toFixed(1)); needle.setAttribute("y2",ny.toFixed(1));
  const el=document.getElementById("rpm");
  el.textContent=Math.round(r);
  el.className="rpm"+(r>=REDRPM?" red":r>300?" run":"");
}
setRpm(0);

// ---- связь ----
function status(cls,txt){ document.getElementById("dot").className="dot"+(cls?" "+cls:"");
  document.getElementById("st").textContent=txt; }
function send(bytes){ if(ws&&ws.readyState===1) ws.send(new Uint8Array(bytes)); }

function telem(dv){
  if(dv.byteLength<7) return;
  setRpm(dv.getUint8(0)|(dv.getUint8(1)<<8));
  const t=Math.round(dv.getUint8(2)/255*100);
  document.getElementById("thr").textContent=t;
  const s=dv.getUint8(7), running=!!(s&0x40), gear=s&0x0f;
  document.getElementById("gear").textContent=gear?gear:"N";
  if(!ign && running){ ign=true; paintIgn(); }   // стенд владеет = двигатель заведён
}

function connect(){
  const host=location.host||"10.110.12.106";
  status("","подключение…");
  try{
    ws=new WebSocket("ws://"+host+"/ctrl"); ws.binaryType="arraybuffer";
    ws.onopen=()=>{ status("on","на связи"); send([0x01,Math.round(vol/100*255)]); send([0x09,mode]); };
    ws.onmessage=e=>telem(new DataView(e.data));
    ws.onerror=()=>status("err","ошибка связи");
    ws.onclose=()=>{ status("err","нет связи — переподключение"); setTimeout(connect,1500); };
  }catch(e){ status("err",e.message); setTimeout(connect,2000); }
}

// ---- зажигание ----
function paintIgn(){ const b=document.getElementById("ign");
  b.classList.toggle("on",ign);
  document.getElementById("ignTxt").textContent=ign?"Заглушить":"Запустить двигатель"; }
document.getElementById("ign").onclick=()=>{ ign=!ign; paintIgn();
  send([0x06, ign?1:0, Math.round(thr/100*255)]); };

// ---- режимы ----
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{
  mode=+b.dataset.m;
  document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  send([0x09,mode]);
});

// ---- громкость ----
const volEl=document.getElementById("vol");
volEl.oninput=()=>{ vol=+volEl.value; document.getElementById("volVal").textContent=vol;
  send([0x01,Math.round(vol/100*255)]); };

// ---- педаль ----
const pedal=document.getElementById("pedal"), pfill=document.getElementById("pfill"),
      plbl=document.getElementById("plbl");
function setThr(v){ thr=Math.max(0,Math.min(100,Math.round(v)));
  pfill.style.height=thr+"%"; plbl.textContent=thr+"%";
  if(thr!==lastThr){ lastThr=thr; send([0x06, ign?1:0, Math.round(thr/100*255)]); } }
function pct(e){ const r=pedal.getBoundingClientRect();
  return (1-(e.clientY-r.top)/r.height)*100; }   // верх = больше газа
let held=false;
pedal.addEventListener("pointerdown",e=>{ e.preventDefault(); held=true; pedal.classList.add("held");
  try{pedal.setPointerCapture(e.pointerId);}catch(_){} setThr(pct(e)); });
pedal.addEventListener("pointermove",e=>{ if(held) setThr(pct(e)); });
function up(){ if(held){ held=false; pedal.classList.remove("held"); setThr(0); } }
pedal.addEventListener("pointerup",up);
pedal.addEventListener("pointercancel",up);
pedal.addEventListener("contextmenu",e=>e.preventDefault());

connect();
</script>
</body>
</html>
